<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Command Center | Velvet Bean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: white !important; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-end mb-12 border-b border-white/10 pb-8">
            <h1 class="text-4xl font-black tracking-tighter uppercase">Command Center</h1>
            <a href="/" class="text-[10px] border border-white/20 px-6 py-2 rounded-full uppercase tracking-widest font-bold">Back to Site</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="glass-panel p-8 rounded-[2.5rem]">
                <h2 class="text-orange-500 font-black text-xs uppercase mb-8">Operations Logic</h2>
                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] text-gray-500 mb-2 font-bold uppercase">Operating Days</p>
                        <select id="days" class="w-full p-4 rounded-xl text-sm">
                            <option value="All Days">All Days</option>
                            <option value="Weekdays">Weekdays Only</option>
                            <option value="Weekends">Weekends Only</option>
                        </select>
                    </div>
                    <button onclick="saveRules()" class="w-full bg-orange-500 text-black font-black py-4 rounded-xl uppercase text-xs">Update Rules</button>
                </div>
            </div>

            <div class="glass-panel p-8 rounded-[2.5rem]">
                <h2 class="text-blue-500 font-black text-xs uppercase mb-8">New Menu Item</h2>
                <form action="/api/menu" method="post" class="space-y-4">
                    <input name="name" placeholder="Item Name" class="w-full p-4 rounded-xl text-sm" required>
                    <input name="price" placeholder="Price (e.g. $22)" class="w-full p-4 rounded-xl text-sm" required>
                    <input name="photo" placeholder="Image URL" class="w-full p-4 rounded-xl text-sm" required>
                    <button type="submit" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase text-xs">Add to Menu</button>
                </form>
            </div>

            <div class="glass-panel p-8 rounded-[2.5rem] h-[600px] flex flex-col">
                <h2 class="text-gray-500 font-black text-xs uppercase mb-8">Live Menu Selection</h2>
                <div id="admin-menu-list" class="space-y-3 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadAdmin() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            document.getElementById('admin-menu-list').innerHTML = menu.map(item => `
                <div class="flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5 group">
                    <div>
                        <p class="text-sm font-bold">${item.name}</p>
                        <p class="text-[10px] text-orange-400 font-bold">${item.price}</p>
                    </div>
                    <button onclick="deleteItem('${item._id}')" class="text-red-500 text-[10px] font-black uppercase opacity-0 group-hover:opacity-100 transition">Delete</button>
                </div>
            `).join('');
        }

        async function deleteItem(id) {
            if(confirm("Permanently remove this item?")) {
                await fetch(`/api/menu/${id}`, { method: 'DELETE' });
                loadAdmin();
            }
        }

        async function saveRules() {
            const data = { days: document.getElementById('days').value };
            await fetch('/api/rules', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(data) 
            });
            alert("Bistro Rules Updated!");
        }

        loadAdmin();
    </script>
</body>
</html>
