<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Command Center | Velvet Bean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: white !important; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-[1500px] mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-5xl font-black italic tracking-tighter">COMMAND CENTER</h1>
            <div class="text-[10px] text-gray-500 uppercase font-bold tracking-[0.3em]">Administrator: Aditya</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div class="glass p-8 rounded-3xl">
                    <h2 class="text-orange-500 font-bold text-[10px] uppercase tracking-widest mb-6">Operations</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] text-gray-500 block mb-1 uppercase font-bold">Operating Days</label>
                            <select id="rules-days">
                                <option value="All Days">All Days</option>
                                <option value="Weekdays">Weekdays Only</option>
                                <option value="Weekends">Weekends Only</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] text-gray-500 block mb-1 uppercase font-bold">Open</label><input type="number" id="rules-open" value="10"></div>
                            <div><label class="text-[10px] text-gray-500 block mb-1 uppercase font-bold">Close</label><input type="number" id="rules-close" value="23"></div>
                        </div>
                        <button onclick="saveRules()" class="w-full bg-orange-600 py-4 rounded-xl font-black text-xs uppercase hover:bg-orange-500 transition">Update Bistro</button>
                    </div>
                </div>

                <div class="glass p-8 rounded-3xl">
                    <h2 class="text-blue-500 font-bold text-[10px] uppercase tracking-widest mb-6">New Menu Item</h2>
                    <input id="m-name" placeholder="Item Name" class="mb-2">
                    <input id="m-price" placeholder="Price" class="mb-2">
                    <input id="m-photo" placeholder="Image URL" class="mb-4">
                    <button onclick="addMenu()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xs uppercase hover:bg-blue-500 transition">Add Item</button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="glass rounded-3xl overflow-hidden">
                    <div class="p-6 border-b border-white/5 bg-white/5 flex justify-between">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Live Reservations (Newest First)</span>
                    </div>
                    <table class="w-full text-left">
                        <thead class="text-[10px] font-bold text-gray-600 uppercase">
                            <tr><th class="p-6">Guest</th><th class="p-6">Schedule</th><th class="p-6">Guests</th><th class="p-6 text-right">Action</th></tr>
                        </thead>
                        <tbody id="booking-list" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>

                <div class="glass p-8 rounded-3xl">
                    <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-6">Live Menu Feed</h2>
                    <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const bRes = await fetch('/api/bookings');
            const bookings = await bRes.json();
            document.getElementById('booking-list').innerHTML = bookings.map(b => `
                <tr class="hover:bg-white/5 transition text-sm">
                    <td class="p-6 font-bold">${b.name}</td>
                    <td class="p-6 text-orange-400 font-mono">${b.date} • ${b.time}</td>
                    <td class="p-6 text-gray-400">${b.guests} Guests</td>
                    <td class="p-6 text-right">
                        <button onclick="deleteBooking('${b._id}')" class="text-red-500 font-black text-[10px] uppercase">Cancel</button>
                    </td>
                </tr>
            `).join('');

            const mRes = await fetch('/api/menu');
            const menu = await mRes.json();
            document.getElementById('menu-grid').innerHTML = menu.map(m => `
                <div class="flex items-center justify-between bg-black/40 p-4 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <img src="${m.photo}" class="w-10 h-10 rounded-xl object-cover">
                        <div><p class="text-[11px] font-bold">${m.name}</p><p class="text-blue-400 text-[10px] font-bold">${m.price}</p></div>
                    </div>
                    <button onclick="deleteMenu('${m._id}')" class="text-gray-700 hover:text-red-500">✕</button>
                </div>
            `).join('');
        }

        async function saveRules() {
            const days = document.getElementById('rules-days').value;
            const open = document.getElementById('rules-open').value;
            const close = document.getElementById('rules-close').value;
            await fetch('/api/rules', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({days, open, close}) });
            alert("Rules Synced!");
        }

        async function deleteBooking(id) {
            if(confirm("Confirm deletion?")) {
                await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        async function deleteMenu(id) {
            await fetch(`/api/menu/${id}`, { method: 'DELETE' });
            loadData();
        }

        async function addMenu() {
            const fd = new FormData();
            fd.append('name', document.getElementById('m-name').value);
            fd.append('price', document.getElementById('m-price').value);
            fd.append('photo', document.getElementById('m-photo').value);
            await fetch('/api/menu', { method: 'POST', body: fd });
            loadData();
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
