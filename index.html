<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Command Center | Velvet Bean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .auth-overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .hidden-auth { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="p-6 md:p-16">

    <div id="auth-wall" class="auth-overlay">
        <div class="glass p-12 rounded-[3rem] w-full max-w-md text-center">
            <h2 class="text-4xl font-black italic mb-8">Admin Access</h2>
            <div class="space-y-4">
                <input id="uname" type="text" placeholder="Username" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-orange-500">
                <input id="pass" type="password" placeholder="Password" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-orange-500">
                <button onclick="login()" class="w-full bg-orange-600 py-4 rounded-2xl font-bold uppercase tracking-widest hover:bg-orange-700 transition">Unlock Terminal</button>
            </div>
            <p id="auth-err" class="text-red-500 text-[10px] mt-4 uppercase font-bold hidden">Invalid Credentials</p>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-end mb-16 border-b border-white/10 pb-10">
            <div>
                <h1 class="text-7xl font-black tracking-tighter italic">Command Center</h1>
                <p class="text-orange-500 text-[10px] uppercase tracking-[0.5em] font-bold mt-2">Live Cloud Operations & Google Sync</p>
            </div>
            <div class="flex gap-4">
                <button onclick="syncAll()" class="bg-green-600/10 text-green-500 border border-green-500/30 px-10 py-4 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-green-600 hover:text-white transition">Sync All To Sheets</button>
                <a href="/" class="border border-white/20 px-10 py-4 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">Public Site</a>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-12">
            <div class="xl:col-span-1 space-y-8">
                <div class="bg-zinc-900/50 p-8 rounded-[2.5rem] border border-white/5">
                    <h2 class="text-orange-500 font-bold text-[10px] uppercase tracking-[0.3em] mb-6">Operating Rules</h2>
                    <div id="days-grid" class="flex flex-wrap gap-2 mb-6">
                        </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[9px] text-gray-500 uppercase font-bold">Open Time: <span id="open-val">18:00</span></label>
                            <input type="range" id="open-time" min="0" max="23" class="w-full accent-orange-500">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-500 uppercase font-bold">Close Time: <span id="close-val">23:00</span></label>
                            <input type="range" id="close-time" min="0" max="23" class="w-full accent-orange-500">
                        </div>
                    </div>
                    <button onclick="saveSettings()" class="w-full mt-6 bg-white/5 border border-white/10 py-3 rounded-xl text-[9px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">Update Schedule</button>
                </div>

                <div class="bg-zinc-900/50 p-8 rounded-[2.5rem] border border-white/5">
                    <h2 class="text-blue-500 font-bold text-[10px] uppercase tracking-[0.3em] mb-6">New Signature Item</h2>
                    <form action="/api/menu" method="post" class="space-y-3">
                        <input name="name" placeholder="Item Name" class="w-full bg-black border border-white/10 p-4 rounded-xl text-xs outline-none focus:border-blue-500">
                        <input name="price" placeholder="Price (e.g. ₹1,200)" class="w-full bg-black border border-white/10 p-4 rounded-xl text-xs outline-none">
                        <input name="photo" placeholder="Unsplash Image URL" class="w-full bg-black border border-white/10 p-4 rounded-xl text-xs outline-none">
                        <button class="w-full bg-blue-600 py-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest">Create Item</button>
                    </form>
                </div>
            </div>

            <div class="xl:col-span-3 space-y-12">
                <div class="bg-zinc-900 rounded-[3rem] border border-white/5 overflow-hidden">
                    <div class="p-8 border-b border-white/5 bg-white/5 flex justify-between items-center">
                        <h2 class="text-[10px] font-bold uppercase tracking-widest">Live Reservations (Top 10)</h2>
                        <span class="flex items-center gap-2 text-green-500 text-[9px] font-bold uppercase">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Jessica AI Active
                        </span>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-black text-[9px] uppercase text-gray-500 font-bold">
                            <tr><th class="p-6">Guest</th><th class="p-6">Date</th><th class="p-6">Time</th><th class="p-6 text-center">Pax</th><th class="p-6">Status</th><th class="p-6 text-right">Action</th></tr>
                        </thead>
                        <tbody id="booking-table" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>

                <h2 class="text-[10px] font-bold uppercase tracking-widest text-gray-500 ml-4">Active Menu Management</h2>
                <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        const ALL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        let selectedDays = [];

        async function login() {
            const u = document.getElementById('uname').value;
            const p = document.getElementById('pass').value;
            const res = await fetch('/api/login', { method: 'POST', body: JSON.stringify({username:u, password:p}), headers: {'Content-Type':'application/json'} });
            if (res.ok) {
                document.getElementById('auth-wall').classList.add('hidden-auth');
                loadAll();
            } else {
                document.getElementById('auth-err').classList.remove('hidden');
            }
        }

        async function loadAll() {
            // Load Settings
            const sRes = await fetch('/api/settings');
            const settings = await sRes.json();
            selectedDays = settings.days;
            document.getElementById('open-val').innerText = settings.open;
            document.getElementById('close-val').innerText = settings.close;
            renderDays();

            // Load Bookings
            const bRes = await fetch('/api/bookings');
            const bookings = await bRes.json();
            const top10 = bookings
                .sort((a,b) => new Date(a.date || '2099') - new Date(b.date || '2099'))
                .slice(0, 10);
            
            document.getElementById('booking-table').innerHTML = top10.map(b => `
                <tr class="hover:bg-white/5 transition group">
                    <td class="p-6 font-bold text-gray-200 text-xs">${b.name || 'Incognito Guest'}</td>
                    <td class="p-6 text-gray-400 text-xs">${b.date || '---'}</td>
                    <td class="p-6 font-mono text-orange-400 text-xs font-bold">${b.time || '--:--'}</td>
                    <td class="p-6 text-center text-xs font-bold text-gray-500">${b.guests || '-'}</td>
                    <td class="p-6"><span class="px-2 py-1 bg-white/5 rounded text-[8px] uppercase font-black">${b.status}</span></td>
                    <td class="p-6 text-right"><button onclick="delBooking('${b._id}')" class="text-red-600 text-[10px] font-black hover:underline">REJECT</button></td>
                </tr>
            `).join('');

            // Load Menu
            const mRes = await fetch('/api/menu');
            const menu = await mRes.json();
            document.getElementById('menu-list').innerHTML = menu.map(m => `
                <div class="bg-zinc-900/80 p-6 rounded-[2rem] border border-white/5 flex justify-between items-center group transition hover:border-white/20">
                    <div class="flex items-center gap-5">
                        <div class="w-16 h-16 rounded-2xl overflow-hidden grayscale group-hover:grayscale-0 transition duration-700">
                            <img src="${m.photo}" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <p class="font-bold text-[10px] uppercase tracking-wider">${m.name}</p>
                            <p class="text-blue-500 font-mono text-xs mt-1">${m.price}</p>
                        </div>
                    </div>
                    <button onclick="delMenu('${m._id}')" class="bg-red-600/10 text-red-500 p-3 rounded-full hover:bg-red-600 hover:text-white transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function renderDays() {
            document.getElementById('days-grid').innerHTML = ALL_DAYS.map(d => `
                <button onclick="toggleDay('${d}')" class="px-3 py-2 rounded-lg text-[9px] font-bold uppercase transition ${selectedDays.includes(d) ? 'bg-orange-600 text-white' : 'bg-white/5 text-gray-500 border border-white/5'}">${d.slice(0,3)}</button>
            `).join('');
        }

        function toggleDay(d) {
            if(selectedDays.includes(d)) selectedDays = selectedDays.filter(x => x !== d);
            else selectedDays.push(d);
            renderDays();
        }

        async function saveSettings() {
            const data = {
                days: selectedDays,
                open: document.getElementById('open-time').value + ":00",
                close: document.getElementById('close-time').value + ":00"
            };
            await fetch('/api/settings', { method: 'POST', body: JSON.stringify(data), headers: {'Content-Type':'application/json'} });
            alert("Restaurant Schedule Synchronized.");
            loadAll();
        }

        async function syncAll() {
            const res = await fetch('/api/sync', {method:'POST'});
            const data = await res.json();
            alert(data.message);
        }

        async function delBooking(id) { await fetch(`/api/bookings/${id}`, {method:'DELETE'}); loadAll(); }
        async function delMenu(id) { await fetch(`/api/menu/${id}`, {method:'DELETE'}); loadAll(); }
        
        document.getElementById('open-time').oninput = function() { document.getElementById('open-val').innerText = this.value + ":00"; }
        document.getElementById('close-time').oninput = function() { document.getElementById('close-val').innerText = this.value + ":00"; }

        setInterval(loadAll, 10000);
    </script>
</body>
</html>
