<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Velvet Bean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-10">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-5xl font-black mb-12 tracking-tighter">Command Center</h1>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-panel p-6 rounded-3xl">
                    <h2 class="text-blue-500 font-bold text-xs uppercase mb-4">New Menu Item</h2>
                    <input id="m-name" placeholder="Name" class="w-full bg-black p-3 rounded-xl mb-2 text-sm border border-white/10">
                    <input id="m-price" placeholder="Price" class="w-full bg-black p-3 rounded-xl mb-2 text-sm border border-white/10">
                    <input id="m-photo" placeholder="Photo URL" class="w-full bg-black p-3 rounded-xl mb-4 text-sm border border-white/10">
                    <button onclick="addMenuItem()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase text-xs">Add Item</button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="glass-panel rounded-3xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[10px] uppercase font-bold text-gray-500">
                            <tr><th class="p-5">Guest</th><th class="p-5">Time</th><th class="p-5">Guests</th><th class="p-5 text-right">Action</th></tr>
                        </thead>
                        <tbody id="booking-table-body" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>

                <div id="menu-list" class="grid grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const bRes = await fetch('/api/bookings');
            const bookings = await bRes.json();
            document.getElementById('booking-table-body').innerHTML = bookings.map(b => `
                <tr class="text-sm">
                    <td class="p-5 font-bold">${b.name}</td>
                    <td class="p-5 text-orange-400 font-mono">${b.time}</td>
                    <td class="p-5 text-gray-400">${b.guests}</td>
                    <td class="p-5 text-right">
                        <button onclick="deleteBooking('${b._id}')" class="text-red-500 font-bold uppercase text-[10px]">Cancel</button>
                    </td>
                </tr>
            `).join('');

            const mRes = await fetch('/api/menu');
            const menu = await mRes.json();
            document.getElementById('menu-list').innerHTML = menu.map(m => `
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <img src="${m.photo}" class="w-12 h-12 rounded-xl object-cover">
                        <div><p class="font-bold text-xs">${m.name}</p><p class="text-blue-400 text-[10px] font-bold">${m.price}</p></div>
                    </div>
                    <button onclick="deleteMenu('${m._id}')" class="text-gray-600 hover:text-red-500 text-xs">✕</button>
                </div>
            `).join('');
        }

        async function addMenuItem() {
            const fd = new FormData();
            fd.append('name', document.getElementById('m-name').value);
            fd.append('price', document.getElementById('m-price').value);
            fd.append('photo', document.getElementById('m-photo').value);
            await fetch('/api/menu', { method: 'POST', body: fd });
            loadData();
        }

        async function deleteBooking(id) {
            if(confirm("Delete this row?")) {
                await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        async function deleteMenu(id) {
            await fetch(`/api/menu/${id}`, { method: 'DELETE' });
            loadData();
        }

        setInterval(loadData, 5000);
        loadData();
    </script>
</body>
</html>
