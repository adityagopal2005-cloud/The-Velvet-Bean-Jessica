<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Velvet Bean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: white !important; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .status-confirmed { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-talking { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-[1600px] mx-auto">
        <div class="flex justify-between items-end mb-12 border-b border-white/10 pb-8">
            <div>
                <h1 class="text-5xl font-black tracking-tighter">Command Center</h1>
                <p class="text-gray-500 mt-2 uppercase text-[10px] tracking-[0.2em] font-bold">Staff Portal</p>
            </div>
            <a href="/" class="text-xs border border-white/20 px-6 py-2 rounded-full hover:bg-white hover:text-black transition uppercase tracking-widest font-bold">Back to Site</a>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-1 space-y-8">
                <div class="glass-panel p-8 rounded-[2rem] space-y-6">
                    <h2 class="text-orange-500 font-black text-xs uppercase tracking-[0.2em]">Operations Logic</h2>
                    <div>
                        <p class="text-[10px] text-gray-500 mb-2 font-bold uppercase">Operating Days</p>
                        <select id="rules-days" class="w-full bg-black border border-white/10 p-4 rounded-xl text-sm mb-4">
                            <option value="All Days">All Days</option>
                            <option value="Weekdays">Weekdays Only</option>
                            <option value="Weekends">Weekends Only</option>
                        </select>
                    </div>
                    <button onclick="updateRules()" class="w-full bg-orange-500 text-black font-black py-4 rounded-2xl hover:bg-orange-400 transition uppercase text-xs">Update Rules</button>
                </div>
            </div>

            <div class="xl:col-span-3 space-y-8">
                <div class="bg-zinc-900/40 rounded-[2.5rem] border border-white/5 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="text-[10px] uppercase font-bold text-gray-500 bg-black/40">
                            <tr><th class="p-6">Guest</th><th class="p-6">Time</th><th class="p-6">Status</th><th class="p-6 text-right">Control</th></tr>
                        </thead>
                        <tbody id="booking-table-body" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('/api/bookings');
            const bookings = await res.json();
            document.getElementById('booking-table-body').innerHTML = bookings.map(b => `
                <tr class="hover:bg-white/5 transition text-sm">
                    <td class="p-6 font-bold text-white">${b.name || 'Guest'}</td>
                    <td class="p-6 text-orange-400 font-mono font-bold">${b.date} @ ${b.time}</td>
                    <td class="p-6"><span class="status-badge ${b.status === 'Confirmed' ? 'status-confirmed' : 'status-talking'}">${b.status}</span></td>
                    <td class="p-6 text-right">
                        <button onclick="deleteBooking('${b._id}')" class="text-red-500 text-[10px] font-black uppercase">Cancel</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteBooking(id) {
            if(confirm("Cancel this reservation?")) {
                await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        async function updateRules() {
            const days = document.getElementById('rules-days').value;
            await fetch('/api/rules', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({days}) 
            });
            alert("Bistro Rules Updated!");
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
