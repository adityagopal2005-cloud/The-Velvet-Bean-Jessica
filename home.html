<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Velvet Bean | Signature Rooftop Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Playfair Display', serif; }
        .hero { background: linear-gradient(to bottom, rgba(0,0,0,0.5), #050505), url('https://images.unsplash.com/photo-1533333484556-519358a7a052?q=80&w=2070'); background-size: cover; background-position: center; }
    </style>
</head>
<body>
    <header class="hero h-screen flex flex-col items-center justify-center text-center px-6">
        <h1 class="text-8xl font-black mb-6">Velvet Bean.</h1>
        <p class="text-xl font-light text-gray-300 mb-10 max-w-2xl">A rooftop escape where city lights meet artisanal excellence.</p>
        <a href="tel:+18782907611" class="border border-white/20 px-12 py-5 rounded-full hover:bg-white hover:text-black transition uppercase tracking-widest text-xs font-bold">Book via AI</a>
    </header>

    <section id="menu" class="py-32 px-10">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-6xl mb-20 text-center">The Selection</h2>
            <div id="dynamic-menu" class="grid grid-cols-1 md:grid-cols-2 gap-16"></div>
        </div>
    </section>

    <script>
        async function fetchMenu() {
            const res = await fetch('/api/menu');
            const items = await res.json();
            document.getElementById('dynamic-menu').innerHTML = items.map(item => `
                <div class="flex items-center space-x-8">
                    <img src="${item.photo}" class="w-32 h-32 rounded-3xl object-cover grayscale hover:grayscale-0 transition duration-500">
                    <div class="flex-1">
                        <div class="flex justify-between border-b border-white/10 pb-2">
                            <span class="text-xl font-bold">${item.name}</span>
                            <span class="text-orange-400">${item.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        fetchMenu();
    </script>
</body>
</html>
