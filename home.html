<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Velvet Bean | Signature Rooftop Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; scroll-behavior: smooth; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hero-section {
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), #050505), 
                        url('https://images.unsplash.com/photo-1533333484556-519358a7a052?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
    </style>
</head>
<body>
    <nav class="fixed w-full z-50 px-10 py-8 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <div class="text-2xl font-serif tracking-widest uppercase">Velvet Bean</div>
        <div class="space-x-10 text-xs uppercase tracking-[0.3em] text-gray-300 font-light">
            <a href="#menu" class="hover:text-white transition">Menu</a>
            <a href="/admin" class="bg-white/10 px-5 py-2 rounded-full border border-white/20 hover:bg-white hover:text-black transition">Admin</a>
        </div>
    </nav>

    <header class="hero-section h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="space-y-4 mb-8 text-center">
            <span class="text-orange-400 uppercase tracking-[0.5em] text-sm">Est. 2026 — Jaipur</span>
            <h1 class="text-7xl md:text-9xl font-serif tracking-tighter leading-none">Elevated <br> Dining.</h1>
        </div>
        <a href="tel:+18782907611" class="glass px-16 py-6 rounded-full text-xl font-bold hover:bg-white hover:text-black transition-all duration-500 shadow-2xl">
            Book via AI Concierge
        </a>
    </header>

    <section id="menu" class="py-32 bg-[#050505] px-10">
        <div id="dynamic-menu" class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-16"></div>
    </section>

    <script>
        async function fetchMenu() {
            const res = await fetch('/api/menu');
            const items = await res.json();
            document.getElementById('dynamic-menu').innerHTML = items.map(item => `
                <div class="group flex items-center space-x-8 p-4 hover:bg-white/[0.02] rounded-3xl transition duration-500">
                    <img src="${item.photo}" class="w-40 h-40 rounded-2xl object-cover grayscale group-hover:grayscale-0 transition duration-700">
                    <div class="flex-1">
                        <div class="flex justify-between items-baseline border-b border-white/10 pb-2">
                            <span class="text-2xl font-serif">${item.name}</span>
                            <span class="text-orange-400 font-light">${item.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        fetchMenu();
    </script>
</body>
</html>
